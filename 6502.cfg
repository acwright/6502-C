# ***                                      ***
# ***     AC6502 C PROGRAM — LINKER CONFIG  ***
# ***                                      ***
#
# Layout for a C program loaded into RAM at $0800 and started from BASIC.
#
#   $003A-$00FF   ZEROPAGE  — cc65 runtime (26 bytes) + user zero page
#   $0800-$77FF   RAM       — STARTUP, CODE, RODATA, DATA, BSS, then heap
#   $7800-$7FFF   C stack   — grows DOWN from __STACKSTART__
#
# The zero page window is the one the BIOS documents as free for user
# programs.  Everything below $3A belongs to BASIC, the Kernal or the
# Monitor, and the cc65 runtime would quietly corrupt it.
#
# The C stack is the cc65 parameter stack (c_sp), not the CPU stack — the
# CPU stack stays where the hardware puts it at $0100-$01FF.  malloc takes
# what is left between the end of BSS and the bottom of the C stack, so
# shrinking __STACKSIZE__ hands that space to the heap and vice versa.
#
# STARTUP is listed first so crt0's BASIC stub lands at $0800 and the
# entry point lands at $080C, which is what "SYS 2060" jumps to.

FEATURES {
  CONDES: type    = constructor,
          label   = __CONSTRUCTOR_TABLE__,
          count   = __CONSTRUCTOR_COUNT__,
          segment = ONCE;
  CONDES: type    = destructor,
          label   = __DESTRUCTOR_TABLE__,
          count   = __DESTRUCTOR_COUNT__,
          segment = RODATA;
  CONDES: type    = interruptor,
          label   = __INTERRUPTOR_TABLE__,
          count   = __INTERRUPTOR_COUNT__,
          segment = RODATA,
          import  = __CALLIRQ__;
}

SYMBOLS {
  __STARTUP__:    type = import;                # pull crt0 out of 6502.lib
  __STACKSIZE__:  type = weak, value = $0800;   # 2 KB C parameter stack
  __STACKSTART__: type = weak, value = $8000;   # first byte past usable RAM
}

MEMORY {
  ZP:  file = "", define = yes, start = $003A, size = $00C6;
  RAM: file = %O, define = yes, start = $0800,
                                size = __STACKSTART__ - __STACKSIZE__ - $0800;
}

SEGMENTS {
  ZEROPAGE: load = ZP,  type = zp;
  STARTUP:  load = RAM, type = ro;
  LOWCODE:  load = RAM, type = ro,  optional = yes;
  ONCE:     load = RAM, type = ro,  optional = yes;
  CODE:     load = RAM, type = ro;
  RODATA:   load = RAM, type = ro;
  DATA:     load = RAM, type = rw;
  BSS:      load = RAM, type = bss, define = yes;
}
