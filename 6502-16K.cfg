# ***                                          ***
# ***     AC6502 C CARTRIDGE — LINKER CONFIG    ***
# ***                                          ***
#
# A cartridge overlays the ROM address space at $C000-$FFFF, replacing the
# Monitor, BASIC, Wozmon and the CPU vectors with your own code.  The Kernal
# ($A000-$B7FF) and character set ($B800-$BFFF) stay put underneath, so the
# whole jump table is still yours to call.
#
# 16K is the code space: $C000-$FFF9, which is what you budget against.
#
# The FILE this produces is 32K, not 16K.  It spans $8000-$FFFF so it can be
# burned straight to a 28C256 or 27C256, and the low half ($8000-$BFFF) is
# padding that the machine never reads as cartridge ROM.
#
# Execution begins at the RESET vector, which points at crt0cart.s — there is
# no loader and no BASIC stub.  The assembly counterpart of this file is the
# 6502-16K.cfg in 6502-ASM; everything below that it does not have is there to
# give C somewhere to keep its variables.
#
#   $003A-$00FF   ZEROPAGE  — cc65 runtime (26 bytes) + user zero page
#   $0800-$77FF   RAM       — DATA, BSS, then the heap
#   $7800-$7FFF   C stack   — grows DOWN from __STACKSTART__
#   $C000-$FFF9   CART      — STARTUP, CODE, RODATA and the DATA load image
#   $FFFA-$FFFF   VECTORS   — NMI, RESET, IRQ
#
# The split is the one thing a cartridge config has to get right.  Code and
# constants live in ROM and stay there; initialized variables cannot, because
# a program writes to them, so DATA is *loaded* into the cartridge and *run*
# from RAM.  crt0cart.s calls copydata to move it across at reset — which is
# why DATA and BSS carry `define = yes`, as that is what publishes the
# __DATA_LOAD__/__DATA_RUN__/__DATA_SIZE__ and __BSS_*__ symbols copydata,
# zerobss and malloc need.
#
# RAM starts at $0800 rather than $0400 so the FS sector buffer at $0600-$07FF
# stays clear: any FS or St routine writes through it, and a cartridge is the
# case where nothing else is around to warn you.

FEATURES {
  CONDES: type    = constructor,
          label   = __CONSTRUCTOR_TABLE__,
          count   = __CONSTRUCTOR_COUNT__,
          segment = ONCE;
  CONDES: type    = destructor,
          label   = __DESTRUCTOR_TABLE__,
          count   = __DESTRUCTOR_COUNT__,
          segment = RODATA;
  CONDES: type    = interruptor,
          label   = __INTERRUPTOR_TABLE__,
          count   = __INTERRUPTOR_COUNT__,
          segment = RODATA,
          import  = __CALLIRQ__;
}

SYMBOLS {
  __STARTUP__:    type = import;                # pull crt0cart out of the link
  __STACKSIZE__:  type = weak, value = $0800;   # 2 KB C parameter stack
  __STACKSTART__: type = weak, value = $8000;   # first byte past usable RAM
}

MEMORY {
  # Not written to the file — these describe where the program lives at
  # runtime, and RAM comes up as whatever it comes up as.
  ZP:       file = "", define = yes, start = $003A, size = $00C6;
  RAM:      file = "", define = yes, start = $0800,
                                     size = __STACKSTART__ - __STACKSIZE__ - $0800;

  # The 32K EEPROM image.
  PAD:      file = %O, start = $8000, size = $4000, fill = yes, fillval = $00;
  CART:     file = %O, define = yes, start = $C000, size = $3FFA,
                                     fill = yes, fillval = $00;
  VECTORS:  file = %O, start = $FFFA, size = $0006, fill = yes, fillval = $00;
}

SEGMENTS {
  ZEROPAGE: load = ZP,      type = zp;
  STARTUP:  load = CART,    type = ro;                    # crt0cart, at $C000
  LOWCODE:  load = CART,    type = ro,  optional = yes;
  ONCE:     load = CART,    type = ro,  optional = yes;   # constructors
  CODE:     load = CART,    type = ro;
  RODATA:   load = CART,    type = ro;
  DATA:     load = CART,    run  = RAM, type = rw, define = yes;
  BSS:      load = RAM,     type = bss, define = yes;
  VECTORS:  load = VECTORS, type = ro;
}
